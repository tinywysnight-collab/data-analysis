[project]
name = "camunda-refresh"
version = "0.1.0"
description = "Refresh master table Camunda columns from Camunda Report and Comment"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
]

[project.scripts]
camunda-refresh = "camunda_refresh.refresh:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camunda_refresh"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
